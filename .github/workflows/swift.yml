
name: Build PointerLockUnlock IPA

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project PointerLockUnlock.xcodeproj \
            -scheme PointerLockUnlock \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/PointerLockUnlock.app"

          test -d "$APP_PATH" || {
            echo "App bundle not found"
            find build -name "*.app" -type d
            exit 1
          }

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r PointerLockUnlock-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PointerLockUnlock-IPA
          path: PointerLockUnlock-unsigned.ipa
          if-no-files-found: error
