
name: PointerLockUnlock

options:
  bundleIdPrefix: dev.nexo
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  PointerLockUnlock:
    type: application
    platform: iOS
    sources:
      - Sources/PointerLockUnlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nexo.pointerlockunlock
        PRODUCT_NAME: PointerLockUnlock
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Pointer Lock Unlock"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO

